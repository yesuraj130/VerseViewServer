<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Verse View Server — Presenter Console</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/presenter/css/presenter.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/config.js"></script>
</head>
<body class="presenter-body">
  <div class="presenter-app">
    <!-- Top Header -->
    <header class="presenter-header" id="presenter-header">
      <div class="header-left">
        <a class="application-tilte application-title" id="app-logo" title="Verse View Server" href="#">
          <span class="logo-main" data-app-title>Verse View Server</span>
        </a>

        <!-- Live On-Air Monitor Pill -->
        <div class="live-pill" id="live-indicator-pill" title="Current Projection State">
          <span class="live-badge badge-live" id="live-status-badge">LIVE</span>
          <div class="live-pill-meta">
            <span class="live-title" id="live-title-text">Select Song or Scripture</span>
            <span class="live-subtitle" id="live-line-text">Ready for Presentation</span>
          </div>
        </div>
      </div>

      <!-- Quick Action Controls -->
      <div class="quick-action-controls" id="controls-bar">
        <div class="control-group">
          <a href="/" class="control-button" id="btn-home" title="Home" aria-label="Home">
            <svg class="vv-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>
          <button type="button" class="control-button" id="btn-open-add-song" title="Add New Song" aria-label="Add New Song">
            <svg class="vv-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <select id="bibleVersionSelectionDropdown" class="bible-version-dropdown" title="Choose Bible Version" style="display: none;"></select>
        </div>
        <div class="control-group">
          <button type="button" class="control-button" id="btn-prev-slide" title="Previous Slide" aria-label="Previous Slide">
            <svg class="vv-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button type="button" class="control-button" id="btn-next-slide" title="Next Slide" aria-label="Next Slide">
            <svg class="vv-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
        <div class="control-group">
          <button type="button" class="control-button" id="btn-clear" title="Clear Screen" aria-label="Clear Screen">
            <svg class="vv-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="server-dot" id="server-status-dot" title="Server Status: Connected" style="margin-left: 4px;"></div>
      </div>
    </header>

    <!-- Primary Workspace Tabs Bar -->
    <nav class="tabs-bar" id="tabs-bar">
      <div class="tabs-button-container">
        <button type="button" class="tab-button active" data-tab="songs" id="tab-btn-songs">Songs</button>
        <button type="button" class="tab-button" data-tab="bible" id="tab-btn-bible">Bible</button>
      </div>
    </nav>

    <!-- Main Workspace with Tab Views -->
    <main class="tabs-container" id="presenter-workspace">
      
      <!-- ==================== TAB 1: SONGS ==================== -->
      <div class="tab-item active" id="workspace-songs">
        <aside class="navigation-pane">
          <div class="search-input-container">
            <input type="text" id="song-search-input" class="input-search" placeholder="Search song title or alternate title...">
            <button type="button" id="btn-clear-song-search" class="search-clear-button" title="Clear search" aria-label="Clear search" style="display: none;">&times;</button>
          </div>

          <div class="song-searchresults-list" id="song-list-container">
            <!-- Loaded dynamically -->
          </div>
        </aside>

        <div class="resizer-handle" title="Drag to resize panel"></div>

        <section class="slides-pane" id="deck-pane-songs">
          <div class="slides-list-header">
            <h2 class="song-list-title" id="active-song-title">Select a Song</h2>
            <button type="button" class="control-button" id="btn-deck-edit-song" title="Edit current song lyrics" aria-label="Edit current song lyrics" style="display: none;">
              <svg class="vv-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          </div>

          <div class="slides-list" id="slide-deck-songs">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 48px;">Select a song from the library on the left.</div>
          </div>
        </section>
      </div>

      <!-- ==================== TAB 2: BIBLE ==================== -->
      <div class="tab-item" id="workspace-bible">
        <aside class="navigation-pane">

          <div class="recent-strip" id="bible-recent-strip">
            <span style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase;">Recent:</span>
          </div>

          <div class="bible-columns-container" id="bible-cols-container">
            <div class="bible-selection-column bible-col-books">
              <div class="bible-selection-column-title">Book</div>
              <div class="books-grid" id="bible-books-list"></div>
            </div>

            <div class="bible-selection-column bible-col-chapters">
              <div class="bible-selection-column-title">Chapter</div>
              <div class="numbers-grid" id="bible-chapters-list"></div>
            </div>

            <div class="bible-selection-column bible-col-verses">
              <div class="bible-selection-column-title">Verse</div>
              <div class="numbers-grid" id="bible-verses-list"></div>
            </div>
          </div>
        </aside>

        <div class="resizer-handle" title="Drag to resize panel"></div>

        <section class="slides-pane" id="deck-pane-bible">
          <div class="slides-list" id="slide-deck-bible">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 32px 16px;">Select a Bible book and chapter on the left.</div>
          </div>
        </section>
      </div>

    </main>
  </div>

  <!-- Add / Edit Song Dialog -->
  <div class="dialog-backdrop-cover" id="edit-song-dialog" style="display: none;">
    <div class="dialog-content song-editor-dialog-content">
      <div class="dialog-header">
        <h3 id="edit-song-dialog-heading">Add New Song</h3>
        <button id="btn-close-edit-song-dialog" class="btn-icon-tiny" style="font-size: 20px; color: #fff;">&times;</button>
      </div>
      <div class="dialog-body song-editor-dialog-body">
        <input type="hidden" id="edit-song-id-hidden-input">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px;">
          <div class="form-group">
            <label class="form-label" for="edit-song-title-textbox">Song Title</label>
            <input type="text" id="edit-song-title-textbox" class="input-text" placeholder="e.g. Amazing Grace or English / Romanized title">
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-song-secondary-title-textbox">Alternative / Secondary Title</label>
            <input type="text" id="edit-song-secondary-title-textbox" class="input-text" placeholder="e.g. Vernacular script title or alternate title">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 10px;">
          <label class="form-label" for="edit-song-font-textbox">Font Name</label>
          <input type="text" id="edit-song-font-textbox" class="input-text" list="font-list-options" placeholder="e.g. Arial, Baloo Thambi, Latha">
          <datalist id="font-list-options">
            <option value="Baloo Thambi 2">
            <option value="Baloo Thambi">
            <option value="Mukta Malar">
            <option value="Arial">
            <option value="Calibri">
            <option value="Times New Roman">
            <option value="Tamil Bible">
          </datalist>
        </div>

        <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
            <label class="form-label" for="edit-song-lyrics-textarea" style="margin-bottom: 0;">Lyrics &amp; Slides</label>
            <span style="font-size: 11px; color: var(--color-font-muted);">Separate slides with <strong>2 blank lines</strong> (two empty lines)</span>
          </div>
          <textarea id="edit-song-lyrics-textarea" class="editsong-textbox" style="flex-grow: 1; min-height: 240px; font-size: 13px; line-height: 1.5; outline: none; resize: vertical;" placeholder="Slide 1 line 1&#10;Slide 1 line 2&#10;&#10;&#10;Slide 2 line 1&#10;Slide 2 line 2"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn-danger" id="btn-delete-song-dialog" style="display: none; margin-right: auto;">Delete Song</button>
        <button type="button" class="btn-secondary" id="btn-cancel-edit-song-dialog">Cancel</button>
        <button type="button" class="btn-primary" id="btn-save-song">Save Song</button>
      </div>
    </div>
  </div>

  <!-- Modular Presenter JavaScript -->
  <script src="/presenter/js/state.js"></script>
  <script src="/presenter/js/songs.js"></script>
  <script src="/presenter/js/editSong.js"></script>
  <script src="/presenter/js/bible.js"></script>
  <script src="/presenter/js/controls.js"></script>
  <script src="/presenter/js/socket.js"></script>
  <script src="/presenter/js/main.js"></script>
</body>
</html>
