<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Browser Source 1 — Transparent Fullscreen Center</title>
  <link rel="stylesheet" href="/obs/obs.css">
  <script src="/socket.io/socket.io.js"></script>
  <script>
  
var tryCount = 0;
var scene_name_cache = "";
var new_scene_name = "";
var previous_scene_name = "";
var scene_Change_Count = 10;
var obsEventAdded = false;

function pageLoaded()
{
	obsEventAdded = true;
	window.addEventListener("obsSceneChanged", function(event)
	{
		scene_name_cache =  event.detail.name;
		scene_Change_Count = scene_Change_Count + 1;
	});   
}
  </script>
</head>
<body onload="pageLoaded()" class="obs-mode-1 obs-text-broadcast" data-obs-mode="1">
  <div class="obs-container-1 obs-fade obs-hidden" id="obs-viewport">
    <div class="obs-content-1" id="obs-content">
      <!-- Content populated dynamically via Socket.io / API -->
    </div>
  </div>

  <script src="/obs/obs.js"></script>
</body>
</html>
