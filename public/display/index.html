<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Output — Verse View Server</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="display-body">
  <div class="display-viewport" id="display-viewport">
    <div class="display-content" id="display-content">
      <div id="lines-container">
        <div class="display-line">Welcome to Church Presentation</div>
      </div>
      <div class="display-footer-ref" id="display-ref">
        Ready for Presentation
      </div>
    </div>
  </div>

  <!-- Discreet bottom-right status & controls widget -->
  <div class="display-status-widget" id="display-status-widget">
    <span class="server-dot" id="display-socket-dot"></span>
    <span id="display-status-text">Connected</span>
    <button class="display-fs-btn" id="btn-toggle-fs" title="Toggle Fullscreen (F key)">⛶ Fullscreen</button>
  </div>

  <script src="/js/display.js"></script>
</body>
</html>
