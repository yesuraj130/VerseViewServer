<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verse View Server — Display Output</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/display/display.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/config.js"></script>
</head>
<body class="display-body">
  <div class="display-viewport clear-mode" id="display-viewport">
    <div class="display-content" id="display-content">
      <div id="lines-container"></div>
      <div class="display-footer-ref" id="display-ref" style="display: none;"></div>
    </div>
  </div>

  <!-- Discreet bottom-right status & controls widget -->
  <div class="display-status-widget" id="display-status-widget">
    <span class="server-dot" id="display-socket-dot"></span>
    <span id="display-status-text">Connected</span>
    <button class="display-fs-btn" id="btn-toggle-fs" title="Toggle Fullscreen">⛶ Fullscreen</button>
  </div>

  <script src="/js/bamini.js"></script>
  <script src="/display/display.js"></script>
</body>
</html>
