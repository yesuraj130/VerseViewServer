<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Verse View Server — Display Output</title>
  <meta name="description" content="Real-Time Church Presentation Server for Tamil Songs and Bible Scriptures">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verse View Server">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/display/display.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/pwa.js"></script>
</head>
<body class="display-body">
  <div class="display-viewport clear-mode" id="display-viewport">
    <div class="display-content" id="display-content">
      <div id="lines-container"></div>
      <div class="display-footer-ref" id="display-ref" style="display: none;"></div>
    </div>
  </div>

  <!-- Discreet bottom-right status & controls widget -->
  <div class="display-status-widget" id="display-status-widget">
    <span class="server-dot" id="display-socket-dot"></span>
    <span id="display-status-text">Connected</span>
    <button class="display-fs-btn" id="btn-toggle-fs" data-fullscreen-btn title="Toggle Fullscreen (Edge-to-Edge Notch Cover)">⛶ Fullscreen</button>
  </div>

  <script src="/display/display.js"></script>
</body>
</html>
