<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="6" />

  <!-- Projection Screen / Slide Frame -->
  <rect x="96" y="96" width="320" height="220" rx="20" fill="#0b1120" stroke="#38bdf8" stroke-width="8" filter="url(#glow)" />
  
  <!-- Slide Text Lines simulation -->
  <rect x="136" y="140" width="240" height="14" rx="7" fill="#38bdf8" opacity="0.9" />
  <rect x="156" y="170" width="200" height="14" rx="7" fill="#f8fafc" opacity="0.95" />
  <rect x="176" y="200" width="160" height="14" rx="7" fill="#94a3b8" opacity="0.75" />

  <!-- Projection Base Stand / Beam -->
  <polygon points="256,316 236,416 276,416" fill="#0284c7" opacity="0.8" />
  <rect x="200" y="416" width="112" height="18" rx="9" fill="#38bdf8" />

  <!-- Subtle Cross Icon in Top Right -->
  <path d="M380,50 L380,90 M360,65 L400,65" stroke="url(#cross-grad)" stroke-width="8" stroke-linecap="round" />
</svg>
