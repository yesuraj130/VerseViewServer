<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="vv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold Accent Gradient for Cross -->
    <linearGradient id="vv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cyan Light Accent -->
    <linearGradient id="vv-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- White Page Gradient -->
    <linearGradient id="vv-page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="vv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="116" fill="url(#vv-bg)" />

  <!-- Outer Neon Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6" />

  <!-- Luminous Presentation Beam / Stage Arc -->
  <path d="M 120 140 L 256 90 L 392 140 L 416 350 L 96 350 Z" fill="url(#vv-cyan)" opacity="0.12" />

  <!-- Presentation Screen Display Frame -->
  <rect x="86" y="116" width="340" height="236" rx="24" fill="#0b1329" stroke="#38bdf8" stroke-width="8" filter="url(#vv-glow)" />

  <!-- Screen Top Accent Bar -->
  <path d="M 110 120 L 402 120" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

  <!-- Centered Open Bible (High Contrast White & Slate) -->
  <!-- Left Page -->
  <path d="M 256 312 C 210 292 165 292 136 298 L 136 186 C 168 180 212 180 256 200 Z" fill="url(#vv-page)" stroke="#0f172a" stroke-width="3" />
  
  <!-- Right Page -->
  <path d="M 256 312 C 302 292 347 292 376 298 L 376 186 C 344 180 300 180 256 200 Z" fill="url(#vv-page)" stroke="#0f172a" stroke-width="3" />

  <!-- Book Spine Center Fold -->
  <path d="M 256 198 L 256 314" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

  <!-- Book Page Lines (Left) -->
  <line x1="160" y1="214" x2="236" y2="224" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  <line x1="156" y1="238" x2="236" y2="248" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <line x1="160" y1="262" x2="226" y2="272" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Book Page Lines (Right) -->
  <line x1="276" y1="224" x2="352" y2="214" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  <line x1="276" y1="248" x2="356" y2="238" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <line x1="286" y1="272" x2="352" y2="262" stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Golden Radiant Cross (Prominent Center-Top Emblem) -->
  <circle cx="256" cy="154" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5" />
  <!-- Vertical Beam -->
  <rect x="251" y="134" width="10" height="40" rx="4" fill="url(#vv-gold)" />
  <!-- Horizontal Crossbar -->
  <rect x="240" y="145" width="32" height="10" rx="4" fill="url(#vv-gold)" />

  <!-- Projector Base Stand -->
  <polygon points="256,352 236,418 276,418" fill="#0284c7" />
  <rect x="196" y="418" width="120" height="18" rx="9" fill="#38bdf8" />

  <!-- Bold VerseView Text Monogram Badge -->
  <rect x="180" y="444" width="152" height="28" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
  <text x="256" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">VERSEVIEW</text>
</svg>
